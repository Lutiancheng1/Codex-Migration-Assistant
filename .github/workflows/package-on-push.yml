name: Package VSIX on Push

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  package:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            artifact_suffix: win32-x64
          - os: macos-13
            target: darwin-x64
            artifact_suffix: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
            artifact_suffix: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Extension
        run: |
          npm run build
          npx @vscode/vsce package --target ${{ matrix.target }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.ref_name }}-${{ matrix.artifact_suffix }}-${{ github.run_number }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
