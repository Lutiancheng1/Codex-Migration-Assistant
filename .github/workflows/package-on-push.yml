name: Package VSIX on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Extension
        run: |
          npm run build
          npx @vscode/vsce package

      - name: Rename VSIX
        run: |
          ORIGINAL_VSIX=$(ls *.vsix | head -n 1)
          VERSION=$(node -p 'require("./package.json").version')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TARGET_VSIX="codex-migration-assistant-v${VERSION}-${SHORT_SHA}.vsix"
          mv "$ORIGINAL_VSIX" "$TARGET_VSIX"
          echo "VSIX_FILE=$TARGET_VSIX" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Ensure nightly release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly \
              --title "Nightly VSIX" \
              --notes "Latest auto-packaged Codex Migration Assistant build" \
              --prerelease

      - name: Remove previous VSIX assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[] | select(.name | endswith(".vsix")) | .name' | \
          while read -r asset; do
            [ -n "$asset" ] && gh release delete-asset nightly "$asset" -y
          done

      - name: Upload nightly VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly "$VSIX_FILE" --clobber
